[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_URL = "https://mileage-determine-digest-invite.trycloudflare.com/api"

# Keep proxy as fallback for relative /api calls
[[redirects]]
  from = "/api/*"
  to = "https://mileage-determine-digest-invite.trycloudflare.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
