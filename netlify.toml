[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Set VITE_API_URL in the Netlify dashboard to:
# https://YOUR-RENDER-SERVICE.onrender.com/api
# (same origin /api is used when the app is served from Render)

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
