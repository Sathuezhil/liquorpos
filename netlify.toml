[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_URL = "https://peers-larger-organic-impacts.trycloudflare.com/api"

[[redirects]]
  from = "/api/*"
  to = "https://peers-larger-organic-impacts.trycloudflare.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
